single_path_planning:
  # FR3 defaults. Override planning_group and ik_link_name for another robot.
  planning_group: fr3_arm
  ik_link_name: fr3_hand_tcp
  world_frame: world
  compute_ik_service: /compute_ik
  joint_state_topic: /joint_states
  use_sim_time: true
  avoid_collisions: true
  service_timeout: 5.0
  joint_state_timeout: 3.0
  ik_timeout: 0.25

  # Camera sampling and camera-to-IK-link calibration.
  center: [0.45, 0.0, 0.1]
  radius: 0.3
  # L latitude layers and K uniformly spaced azimuths produce L*K poses.
  latitude_layers: 5
  azimuth_samples: 8
  # initial_pose anchors the nearest first view; all_accepted searches every start.
  path_start_mode: initial_pose
  elevation_bounds: [30.0, 80.0]
  azimuth_offset_deg: 0.0
  camera_to_ik_link_xyz: [0.0, 0.0, 0.0]
  camera_to_ik_link_rpy_deg: [0.0, 0.0, 0.0]
  excluded_joint_substrings: [finger, gripper]

  # Projection-overlap path objective.
  camera_yaml: /home/hier-tony/Projects/kinova_isaacsim/env/urdf/camera.yaml
  scan_volume_radius: 0.15
  projection_samples: 2048
  minimum_neighbor_overlap: 0.30
  overlap_weight: 5.0
  two_opt_passes: 30
  random_seed: 7
  # random | spiral | hamilton_2opt | all
  trajectory_mode: all

  # RViz and experiment output.
  hemisphere_topic: /single_path_planning/hemisphere
  candidate_topic: /single_path_planning/candidates
  random_path_topic: /single_path_planning/path_random
  spiral_path_topic: /single_path_planning/path_spiral
  optimized_path_topic: /single_path_planning/path_hamilton_2opt
  comparison_topic: /single_path_planning/path_comparison
  random_display_topic: /single_path_planning/display_random
  spiral_display_topic: /single_path_planning/display_spiral
  optimized_display_topic: /single_path_planning/display_hamilton_2opt
  hemisphere_color_rgb: [0, 180, 255]
  hemisphere_alpha: 0.16
  hemisphere_azimuth_segments: 64
  hemisphere_elevation_segments: 16
  random_color_rgb: [255, 140, 0]
  spiral_color_rgb: [190, 0, 255]
  optimized_color_rgb: [25, 255, 0]
  line_width: 0.012
  point_size: 0.022
  accepted_color_rgb: [255, 40, 40]
  rejected_color_rgb: [0, 0, 0]
  rejected_cross_size: 0.040
  rejected_cross_line_width: 0.006
  trajectory_point_time: 0.25
  result_json: single_path_planning_result.json
  hold_seconds: 0.0

single_view_scan:
  # Kinova motion interface and hand-eye sensor.
  planning_group: manipulator
  ik_link_name: end_effector_link
  end_effector_name: end_effector_link
  ready_state: Ready
  base_frame: base_link
  # Motion conversion and saved T_base_cam use the physical camera link.
  camera_frame: camera_color_frame
  # Isaac's segmentation service expects the rendered optical frame name.
  segmentation_camera_frame: handeye_camera_color_optical_frame
  rgb_topic: /handeye/color/image_raw/compressed
  depth_topic: /handeye/aligned_depth_to_color/image_raw

  # One suffix keeps the image, segmentation, and TF trials paired.
  output_dir: scan_output
  output_suffix: run2
  trajectory_mode: hamilton_2opt
  save_segmentation: true
  segmentation_service: /save_object_segmentations

  # Motion, sensor, TF, and Isaac service timing in seconds.
  motion_timeout: 30.0
  camera_timeout: 5.0
  tf_timeout: 2.0
  segmentation_timeout: 35.0
  settle_time: 1.0
  target_preview_time: 0.5
  trajectory_preview_time: 1.0
